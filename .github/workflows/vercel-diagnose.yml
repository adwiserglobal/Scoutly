name: Vercel diagnose

on:
  push:
    branches:
      - feat/responsive-home-redesign

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest failed deployment when token is available
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not configured in GitHub Actions."
            exit 0
          fi
          npx --yes vercel@latest inspect dpl_3yLWsZUPAp5EW3CeWbemhq3kvcDj --logs --token "$VERCEL_TOKEN" || true
