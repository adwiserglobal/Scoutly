name: Build worldwide places archive

# Overture publishes a new release every month. This job turns it into places.pmtiles
# (see docs/GLOBAL_PLACES.md) and publishes it to Cloudflare R2. Nothing here costs money:
# GitHub-hosted runner minutes plus R2's free tier.
on:
  schedule:
    - cron: '17 5 3 * *' # 3rd of every month, after Overture's release
  workflow_dispatch:
    inputs:
      countries:
        description: 'Comma separated ISO codes (empty = whole world). Start with e.g. BR,US,MX,PT'
        required: false
        default: ''
      min_confidence:
        description: 'Minimum Overture confidence (0-1). Higher = smaller archive'
        required: false
        default: '0.35'
      release:
        description: 'Overture release (empty = latest)'
        required: false
        default: ''

concurrency:
  group: places-tiles
  cancel-in-progress: false

jobs:
  build:
    # The monthly schedule only runs once the repository variable PLACES_TILES_ENABLED is "true"
    # (set it after the first successful manual run); manual runs always work.
    if: github.event_name == 'workflow_dispatch' || vars.PLACES_TILES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Cloudflare R2 settings
        # Fails in seconds (not after the 10-minute build) when a secret is malformed.
        env:
          RAW_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          RAW_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # Accept the bare id, or a pasted endpoint URL; drop spaces and line breaks.
          ACCOUNT_ID=$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d '[:space:]' | sed -E 's#^https?://##; s#\.r2\.cloudflarestorage\.com.*$##')
          BUCKET=$(printf '%s' "$RAW_BUCKET" | tr -d '[:space:]')
          if ! printf '%s' "$ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::R2_ACCOUNT_ID must be the 32-character Cloudflare Account ID (hex). Found ${#ACCOUNT_ID} characters."
            exit 1
          fi
          if [ -z "$BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2_BUCKET, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY must all be set."
            exit 1
          fi
          echo "R2_ENDPOINT=https://${ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
          echo "R2_BUCKET_CLEAN=${BUCKET}" >> "$GITHUB_ENV"
          aws s3 ls "s3://${BUCKET}/" --endpoint-url "https://${ACCOUNT_ID}.r2.cloudflarestorage.com" > /dev/null \
            && echo "R2 bucket reachable with the provided credentials."

      - name: Install build dependencies
        run: pip install duckdb pyarrow pmtiles cryptography

      - name: Resolve Overture release
        id: release
        run: |
          RELEASE="${{ inputs.release }}"
          if [ -z "$RELEASE" ]; then
            RELEASE=$(curl -s "https://overturemaps-us-west-2.s3.amazonaws.com/?delimiter=/&prefix=release/" \
              | grep -o '<Prefix>release/[^<]*/</Prefix>' | sed 's#<Prefix>release/##; s#/</Prefix>##' | sort | tail -n 1)
          fi
          echo "Using Overture release $RELEASE"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build places.pmtiles
        # No AWS_* variables here on purpose: DuckDB would send the R2 keys to the public Overture bucket (403).
        env:
          SCOUTLY_PLACES_KEY: ${{ secrets.SCOUTLY_PLACES_KEY }}
        run: |
          python scripts/places-tiles/build.py \
            --source "s3://overturemaps-us-west-2/release/${{ steps.release.outputs.release }}/theme=places/type=place/*" \
            --release "${{ steps.release.outputs.release }}" \
            --countries "${{ inputs.countries }}" \
            --min-confidence "${{ inputs.min_confidence || '0.35' }}" \
            --out places.pmtiles \
            --tmp-dir "$RUNNER_TEMP"

      - name: Publish to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          FILE="places-${{ steps.release.outputs.release }}.pmtiles"
          aws s3 cp places.pmtiles "s3://${R2_BUCKET_CLEAN}/${FILE}" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"
          # The manifest switches readers to the new file atomically, then older builds are removed.
          echo "{\"file\":\"${FILE}\",\"release\":\"${{ steps.release.outputs.release }}\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > manifest.json
          aws s3 cp manifest.json "s3://${R2_BUCKET_CLEAN}/manifest.json" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json --cache-control "no-store"
          for OLD in $(aws s3 ls "s3://${R2_BUCKET_CLEAN}/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | grep '^places-.*\.pmtiles$' | grep -v "^${FILE}$"); do
            aws s3 rm "s3://${R2_BUCKET_CLEAN}/${OLD}" --endpoint-url "$R2_ENDPOINT"
          done
